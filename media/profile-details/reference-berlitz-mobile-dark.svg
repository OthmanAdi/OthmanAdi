<svg xmlns="http://www.w3.org/2000/svg" width="440" height="372" viewBox="0 0 440 372" role="img" aria-labelledby="title desc"><title id="title">Heike Ehle, Berlitz Deutschland GmbH, März 2024</title><desc id="desc">Exact German excerpt from a historical institutional reference letter: „Herr Adi unterrichtet seine SchülerInnen mit außerordentlichem Erfolg.“</desc><rect x=".75" y=".75" width="438.5" height="370.5" rx="4" fill="#222923" stroke="#435249" stroke-width="1.5"/><rect x=".75" y=".75" width="4" height="370.5" fill="#8fc7ae"/><text x="28" y="46" fill="#b6c6bc" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="1.2">BERLITZ</text><g class="quotation" fill="#f3f2e9" font-family="Georgia, 'Times New Roman', serif" font-size="30"><text x="28" y="108">„Herr Adi unterrichtet seine</text><text x="28" y="146">SchülerInnen mit</text><text x="28" y="184">außerordentlichem Erfolg.“</text></g><path d="M28 224H411" fill="none" stroke="#435249" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="28" y="264" fill="#f3f2e9" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600">Heike Ehle</text><text x="28" y="306" fill="#b6c6bc" font-family="'Segoe UI', Arial, sans-serif" font-size="24" >Berlitz Deutschland GmbH</text><text x="28" y="340" fill="#b6c6bc" font-family="'Segoe UI', Arial, sans-serif" font-size="24" >März 2024</text></svg>
