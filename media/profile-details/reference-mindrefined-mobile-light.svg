<svg xmlns="http://www.w3.org/2000/svg" width="440" height="410" viewBox="0 0 440 410" role="img" aria-labelledby="title desc"><title id="title">David Oesinghaus, MindRefined, 2. Februar 2024</title><desc id="desc">Exact German excerpt from a historical institutional reference letter: „Sein Unterrichtsstil war klar strukturiert, interaktiv und an die Bedürfnisse der Lernenden angepasst.“</desc><rect x=".75" y=".75" width="438.5" height="408.5" rx="4" fill="#faf7f0" stroke="#dcdfd5" stroke-width="1.5"/><rect x=".75" y=".75" width="4" height="408.5" fill="#377c67"/><text x="28" y="46" fill="#58675f" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="1.2">MINDREFINED</text><g class="quotation" fill="#23352e" font-family="Georgia, 'Times New Roman', serif" font-size="30"><text x="28" y="108">„Sein Unterrichtsstil war</text><text x="28" y="146">klar strukturiert, interaktiv</text><text x="28" y="184">und an die Bedürfnisse der</text><text x="28" y="222">Lernenden angepasst.“</text></g><path d="M28 262H411" fill="none" stroke="#dcdfd5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="28" y="302" fill="#23352e" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600">David Oesinghaus</text><text x="28" y="344" fill="#58675f" font-family="'Segoe UI', Arial, sans-serif" font-size="24" >MindRefined</text><text x="28" y="378" fill="#58675f" font-family="'Segoe UI', Arial, sans-serif" font-size="24" >2. Februar 2024</text></svg>
