<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460" role="img" aria-labelledby="title desc"><title id="title">Dominik Baedorf, StartSteps, 28. November 2023</title><desc id="desc">Exact German excerpt from a historical institutional reference letter: „Seine Unterrichtsorganisation und Classroom Management sind strukturiert und stets auf den bestmöglichen Lernerfolg unserer Teilnehmenden ausgerichtet.“</desc><rect x=".75" y=".75" width="438.5" height="458.5" rx="4" fill="#222923" stroke="#435249" stroke-width="1.5"/><rect x=".75" y=".75" width="4" height="458.5" fill="#8fc7ae"/><text x="28" y="46" fill="#b6c6bc" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="1.2">STARTSTEPS</text><g class="quotation" fill="#f3f2e9" font-family="Georgia, 'Times New Roman', serif" font-size="28"><text x="28" y="100">„Seine Unterrichtsorganisation</text><text x="28" y="135">und Classroom Management</text><text x="28" y="170">sind strukturiert und stets</text><text x="28" y="205">auf den bestmöglichen</text><text x="28" y="240">Lernerfolg unserer</text><text x="28" y="275">Teilnehmenden ausgerichtet.“</text></g><path d="M28 312H411" fill="none" stroke="#435249" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="28" y="352" fill="#f3f2e9" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600">Dominik Baedorf</text><text x="28" y="394" fill="#b6c6bc" font-family="'Segoe UI', Arial, sans-serif" font-size="24" >StartSteps</text><text x="28" y="428" fill="#b6c6bc" font-family="'Segoe UI', Arial, sans-serif" font-size="24" >28. November 2023</text></svg>
