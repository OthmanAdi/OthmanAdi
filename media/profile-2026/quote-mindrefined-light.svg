<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc"><title id="title">David Oesinghaus · MindRefined · 2. Februar 2024</title><desc id="desc">Exact German excerpt from a historical institutional reference letter: „Sein Unterrichtsstil war klar strukturiert, interaktiv und an die Bedürfnisse der Lernenden angepasst.“</desc><rect x=".75" y=".75" width="818.5" height="428.5" rx="5" fill="#faf7f0" stroke="#dcdfd5" stroke-width="1.5"/><rect x=".75" y=".75" width="5" height="428.5" fill="#377c67"/><text x="43" y="49" fill="#58675f" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2.5">MINDREFINED</text><g fill="#23352e" font-family="Georgia, 'Times New Roman', serif" font-size="37"><text x="43" y="130">„Sein Unterrichtsstil war klar</text><text x="43" y="179">strukturiert, interaktiv und an die</text><text x="43" y="228">Bedürfnisse der Lernenden angepasst.“</text></g><path d="M44 320H774" fill="none" stroke="#dcdfd5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="43" y="361" fill="#23352e" font-family="'Segoe UI', Arial, sans-serif" font-size="29" font-weight="600">David Oesinghaus</text><text x="43" y="397" fill="#58675f" font-family="'Segoe UI', Arial, sans-serif" font-size="23" >MindRefined · 2. Februar 2024</text></svg>
